# Verify the Nix flake actually builds.
#
# The point of this job is npmDepsHash. It is a content hash over the whole npm
# dependency closure, and it cannot be computed without running Nix — so it gets
# regenerated by hand and pasted in, which means it silently rots the moment
# package-lock.json changes. Checking it here turns "someone will open an issue
# eventually" into a red build on the commit that broke it.
#
# It is also how a hash contributed by someone else gets verified: Nix recomputes
# it from OUR package-lock.json and fails if it disagrees. A wrong hash can only
# break the build — a fixed-output derivation can never be talked into accepting
# different content than the one it names.
name: Nix

on:
  push:
    branches: [master]
    paths:
      - "app/flake.nix"
      - "app/flake.lock"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "app/flake.nix"
      - "app/flake.lock"
      - "app/package.json"
      - "app/package-lock.json"
  workflow_dispatch:

jobs:
  flake:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Catches a malformed flake, a bad lock, and evaluation errors before the
      # expensive build starts.
      - name: Check the flake evaluates
        # Deliberately NOT --all-systems: that evaluates the darwin outputs on a
        # Linux runner, which fails on any package unavailable for that platform
        # and tells you nothing about whether the flake works.
        run: nix flake check --no-build

      # The real test: this is where npmDepsHash is exercised. A stale hash fails
      # here with "hash mismatch in fixed-output derivation" and prints the value
      # that should replace it.
      - name: Build the package
        run: nix build --no-link --print-build-logs

      - name: Check the dev shell resolves
        run: nix develop --command node --version
